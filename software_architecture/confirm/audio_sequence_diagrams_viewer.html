<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音频采集 UML 时序图审核器</title>
  <style>
    :root {
      --bg: #f5f7f6;
      --surface: #ffffff;
      --surface-2: #eef3f0;
      --ink: #17211d;
      --muted: #62716a;
      --line: #d8e0dc;
      --green: #146b4c;
      --blue: #2e5f9f;
      --amber: #946716;
      --red: #9f3f31;
      --shadow: 0 18px 46px rgba(22, 33, 29, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(20, 107, 76, 0.08), transparent 340px),
        var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .title-block h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .title-block p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--green);
    }

    .dot.phone {
      background: var(--blue);
    }

    .dot.cloud {
      background: var(--amber);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: stretch;
    }

    .diagram-panel,
    .side-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .diagram-panel {
      min-width: 0;
      overflow: hidden;
    }

    .diagram-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    .current h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }

    .current p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 6px;
      min-height: 30px;
      padding: 4px 9px;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--surface-2);
    }

    .btn.primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .zoom-label {
      min-width: 50px;
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .range {
      width: 130px;
      accent-color: var(--green);
    }

    .viewport {
      height: calc(100vh - 146px);
      min-height: 560px;
      overflow: auto;
      cursor: grab;
      background:
        linear-gradient(90deg, rgba(216, 224, 220, 0.38) 1px, transparent 1px),
        linear-gradient(rgba(216, 224, 220, 0.38) 1px, transparent 1px),
        #fbfcfb;
      background-size: 28px 28px;
    }

    .viewport.dragging {
      cursor: grabbing;
      user-select: none;
    }

    .svg-wrap {
      transform-origin: 0 0;
      padding: 28px;
    }

    svg {
      display: block;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .side-panel {
      min-height: calc(100vh - 88px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .selector {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    .selector h2,
    .notes h2 {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.25;
    }

    .diagram-list {
      display: grid;
      gap: 8px;
    }

    .diagram-tab {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      padding: 9px 10px;
      cursor: pointer;
    }

    .diagram-tab[aria-pressed="true"] {
      border-color: var(--green);
      background: #eaf5ee;
      color: var(--green);
      font-weight: 700;
    }

    .diagram-tab span {
      display: block;
      color: var(--muted);
      font-weight: 400;
      font-size: 12px;
      margin-top: 2px;
    }

    .notes {
      padding: 14px;
      overflow: auto;
      min-height: 0;
    }

    .note-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }

    .note-list li {
      margin: 6px 0;
    }

    .flow-tooltip {
      position: fixed;
      z-index: 20;
      width: min(360px, calc(100vw - 28px));
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 16px 42px rgba(22, 33, 29, 0.18);
      color: var(--ink);
      pointer-events: none;
      opacity: 0;
      transform: translate(10px, 10px);
      transition: opacity 120ms ease;
    }

    .flow-tooltip.visible {
      opacity: 1;
    }

    .flow-tooltip h3 {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.35;
      color: var(--green);
    }

    .flow-tooltip p {
      margin: 6px 0;
      color: var(--muted);
    }

    .flow-tooltip strong {
      color: var(--ink);
    }

    .device-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: var(--green);
    }

    .device-tag.phone {
      background: var(--blue);
    }

    .device-tag.cloud {
      background: var(--amber);
    }

    .device-tag.user {
      background: var(--muted);
    }

    .device-tag.store {
      background: #566a5f;
    }

    @media (max-width: 1040px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .side-panel {
        min-height: auto;
      }

      .viewport {
        height: 620px;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 12px;
      }

      .topbar,
      .diagram-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .legend,
      .zoom-controls {
        justify-content: flex-start;
      }

      .range {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-block">
        <h1>音频采集 UML 时序图审核器</h1>
        <p>左侧图可缩放和拖拽；悬停图中流程或模块查看说明。</p>
      </div>
      <div class="legend" aria-label="部署设备图例">
        <span class="badge"><span class="dot"></span>眼镜端</span>
        <span class="badge"><span class="dot phone"></span>手机端</span>
        <span class="badge"><span class="dot cloud"></span>云端</span>
      </div>
    </header>

    <div class="workspace">
      <section class="diagram-panel" aria-label="缩放时序图">
        <div class="diagram-toolbar">
          <div class="current">
            <h2 id="diagramTitle">A0 Private 隐私暂停</h2>
            <p id="diagramSubtitle">暂停时强制停止音频预录，并通知视觉进入 L0。</p>
          </div>
          <div class="zoom-controls" aria-label="缩放控制">
            <button class="btn" id="zoomOut" type="button">-</button>
            <input class="range" id="zoomRange" type="range" min="55" max="180" value="100" aria-label="缩放比例">
            <button class="btn" id="zoomIn" type="button">+</button>
            <button class="btn primary" id="fitBtn" type="button">适配</button>
            <span class="zoom-label" id="zoomLabel">100%</span>
          </div>
        </div>
        <div class="viewport" id="viewport">
          <div class="svg-wrap" id="svgWrap"></div>
        </div>
        <div class="flow-tooltip" id="flowTooltip" role="tooltip" aria-hidden="true"></div>
      </section>

      <aside class="side-panel">
        <section class="selector">
          <h2>选择音频层级图</h2>
          <div class="diagram-list" id="diagramList"></div>
        </section>

        <section class="notes">
          <h2>当前图审核点</h2>
          <ul class="note-list" id="reviewNotes"></ul>
        </section>
      </aside>
    </div>
  </div>

  <script>
    const modules = {
      "用户": {
        device: "用户",
        tagClass: "user",
        desc: "手动暂停、恢复、开始记录，或通过真实行为触发会话。用户动作优先级最高。"
      },
      "手机 App": {
        device: "手机端",
        tagClass: "phone",
        desc: "用户入口和后台主控。接收隐私设置、状态展示，并协调音频状态机、视觉状态机和传输任务。"
      },
      "手机后台服务": {
        device: "手机端",
        tagClass: "phone",
        desc: "维持 A1/A2 采集循环，接收眼镜音频帧，连接 VAD、预录缓存和会话检测。"
      },
      "PrivacyPolicyGate": {
        device: "手机端",
        tagClass: "phone",
        desc: "隐私策略门。根据用户暂停、敏感地点、日程和策略配置，决定是否允许保存原始音频。"
      },
      "CapturePolicyGate": {
        device: "手机端",
        tagClass: "phone",
        desc: "确定性策略门。检查隐私、电量、温度、冷却和预算，避免模型或规则误触发导致越权采集。"
      },
      "AudioSessionManager": {
        device: "手机端",
        tagClass: "phone",
        desc: "音频状态机主控。管理 A0/A1/A2、privacy lock 和 BOUNDARY_PENDING，创建会话并驱动 binding OPEN/CHECKPOINT/CLOSE。"
      },
      "GlassCaptureAgent": {
        device: "眼镜端",
        tagClass: "glasses",
        desc: "眼镜端采集执行器。响应手机命令，启动/停止音频，执行拍照和批量文件发送。"
      },
      "Glass Mic": {
        device: "眼镜端",
        tagClass: "glasses",
        desc: "眼镜麦克风硬件或 SDK 音频入口。优先作为近场会话音频来源。"
      },
      "RealTimeAudioLink": {
        device: "眼镜端到手机端",
        tagClass: "phone",
        desc: "实时低码音频数据链路。持续把带 source_seq 和单调时钟的编码帧送到手机，用于 VAD、滚动语义判断和正式会话录音。"
      },
      "LocalAudioSpool": {
        device: "眼镜端",
        tagClass: "store",
        desc: "眼镜端持续滚动音频补偿缓存。租约有效时保存带序号的编码帧，恢复后通过 P2P 补传，只清理 range ACK 明确覆盖的 block。"
      },
      "眼镜麦克风": {
        device: "眼镜端",
        tagClass: "glasses",
        desc: "眼镜麦克风音频源。负责输出靠近用户视角的音频帧。"
      },
      "手机麦克风": {
        device: "手机端",
        tagClass: "phone",
        desc: "兜底音频源。眼镜低电、过热或链路不稳定时接管录音，但需要在时间线上标明来源切换。"
      },
      "LowPowerVAD": {
        device: "手机端优先，可下沉眼镜端",
        tagClass: "phone",
        desc: "低功耗人声检测。首版建议放手机端；若眼镜 SDK 支持稳定低功耗 VAD，可下沉到眼镜端减少音频链路压力。"
      },
      "PreRollAudioBuffer": {
        device: "手机端",
        tagClass: "phone",
        desc: "M3 手机端 60-120 秒加密预录环形缓存。用于补齐自动检测晚于会话开头的问题，不与眼镜 spool 混用。"
      },
      "ConversationDetector": {
        device: "手机端",
        tagClass: "phone",
        desc: "会话检测器。融合持续人声、多说话人、日程和上下文，判断是否从 A1 进入 A2，或是否结束会话。"
      },
      "ConversationRecorder": {
        device: "手机端优先",
        tagClass: "phone",
        desc: "会话录音和切片模块。接收眼镜端已编码帧，负责 60 秒分片、序号、时间戳、样本数和校验和；单个 chunk 不混合音源。"
      },
      "EncryptedMediaStore": {
        device: "手机端",
        tagClass: "store",
        desc: "手机加密媒体库。保存音频分片、manifest、上传状态和缺失区间。"
      },
      "AudioContinuityGuard": {
        device: "手机端",
        tagClass: "phone",
        desc: "连续性检查器。检查序号、样本数、时间范围、缺片、重复和音频源切换对齐。"
      },
      "VisualLevelScheduler": {
        device: "手机端",
        tagClass: "phone",
        desc: "视觉等级调度器。受音频状态托底：A0 强制 L0，A2 默认 L1，L3 必须经过语义触发和策略批准。"
      },
      "UploadQueue": {
        device: "手机端",
        tagClass: "phone",
        desc: "常规上传队列。按 15-60 分钟或会话结束、网络、电量条件批量上传完整音频分片，失败后幂等重试。"
      },
      "LowLatencyTranscriptProvider": {
        device: "手机端",
        tagClass: "phone",
        desc: "手机端滚动粗转写或关键词提供方。持续输出最近 10-20 秒音频语义，不依赖 L1 图片或云端探测包。"
      },
      "BatchTransferManager": {
        device: "手机端",
        tagClass: "phone",
        desc: "批量补传管理器。实时音频链路恢复后，通过 P2P 拉取眼镜 LocalAudioSpool 中尚未确认的帧并做持久化 ACK。"
      },
      "FinalizationCoordinator": {
        device: "手机端",
        tagClass: "phone",
        desc: "会话定稿协调器。先提交本地最终 manifest，再强制刷新待上传分片，等待云端完整性结果；隐私停止不等待网络。"
      },
      "CloudCompletenessGate": {
        device: "云端",
        tagClass: "cloud",
        desc: "云端完整性屏障。根据 binding CLOSE 和 expected_stream_ranges 判断时间线是否收齐；超时输出 final_with_gaps。"
      },
      "VisualTriggerProvider": {
        device: "手机端",
        tagClass: "phone",
        desc: "手机端音频语义触发判断器。M3 使用关键词/规则，M4 可替换本地 LLM；只输出升级建议，不能直接控制相机。"
      },
      "IngestionService": {
        device: "云端",
        tagClass: "cloud",
        desc: "云端接入服务。接收 manifest、音频分片和缺失区间，做幂等校验并触发后续 ASR。"
      },
      "ConversationPipeline": {
        device: "云端",
        tagClass: "cloud",
        desc: "完整 ASR 管线。负责音频拼接、转写、说话人分离、标点和时间戳。"
      },
      "TextMemoryIndex": {
        device: "云端",
        tagClass: "cloud",
        desc: "文本记忆索引。保存逐字稿、音频证据位置，并支持后续检索和问答。"
      },
      "AudioSourceRouter": {
        device: "手机端",
        tagClass: "phone",
        desc: "音频源路由。M3 只强制 GLASSES stream；未来 PHONE stream 使用独立 boot/stream/sequence 和 timeline segment。"
      },
      "ConversationBindingStore": {
        device: "手机端",
        tagClass: "store",
        desc: "追加式会话绑定存储。以 OPEN/CHECKPOINT/CLOSE 把 source_seq 区间归属到 conversation，并固化隐私或重启结束边界。"
      }
    };

    const diagrams = [
      {
        id: "a0-private",
        title: "A0 Private 隐私暂停",
        subtitle: "持久化 privacy lock，拦截旧 generation 回调，并在最终 source_seq 明确后关闭会话 binding。",
        notes: [
          "A0 是硬隐私状态，必须优先于所有自动检测。",
          "进入 A0 后清空或停止预录环，不保存原始音频。",
          "A0 会强制视觉进入 L0，避免音频暂停但相机继续工作的错配。",
          "如果 A2 中途进入 A0，手机立即 LOCAL_SEALED，并进入 BOUNDARY_PENDING；眼镜返回最后 source_seq 后再 CLOSE binding。",
          "privacy lock 持久化后递增 capture generation，旧 generation 的迟到音频/拍照回调 fail-closed 丢弃。",
          "恢复必须引用当前 privacy_lock_id 和明确 user_action_id；恢复后进入 A1，新建 stream，下一次 A2 创建新 conversation_id。"
        ],
        participants: ["用户", "手机 App", "PrivacyPolicyGate", "AudioSessionManager", "ConversationRecorder", "ConversationBindingStore", "EncryptedMediaStore", "FinalizationCoordinator", "GlassCaptureAgent", "PreRollAudioBuffer", "VisualLevelScheduler"],
        blocks: [
          {kind: "alt", from: 4, to: 9, label: "如果当前处于 A2：本地 seal 后异步确定结束边界"},
          {kind: "loop", from: 14, to: 15, label: "A0 持续期间：不采集原始音频"}
        ],
        steps: [
          {from: "用户", to: "手机 App", text: "点击暂停 / 敏感地点 / 隐私日程命中"},
          {from: "手机 App", to: "PrivacyPolicyGate", text: "evaluatePrivacyContext()"},
          {from: "PrivacyPolicyGate", to: "手机 App", text: "recording_allowed = false", dashed: true},
          {from: "手机 App", to: "AudioSessionManager", text: "persistPrivacyLockAndEnterA0(capture_generation++)"},
          {from: "AudioSessionManager", to: "ConversationRecorder", text: "localSealActiveChunkIfA2()"},
          {from: "ConversationRecorder", to: "EncryptedMediaStore", text: "commitLocalSeal(state=BOUNDARY_PENDING)"},
          {from: "AudioSessionManager", to: "GlassCaptureAgent", text: "ENTER_PRIVATE(privacy_lock_id, new_epoch)"},
          {from: "GlassCaptureAgent", to: "AudioSessionManager", text: "ACK(last_generated_source_seq, stopped_at)", dashed: true},
          {from: "AudioSessionManager", to: "ConversationBindingStore", text: "append CLOSE(last_seq or UNKNOWN, end_reason=privacy)"},
          {from: "AudioSessionManager", to: "FinalizationCoordinator", text: "enqueueFinalizeAfterBoundary(conversation_id)"},
          {from: "AudioSessionManager", to: "PreRollAudioBuffer", text: "clearAndStop()"},
          {from: "AudioSessionManager", to: "GlassCaptureAgent", text: "oldGenerationCallbacksMustBeDropped()"},
          {from: "AudioSessionManager", to: "VisualLevelScheduler", text: "forceLevel(L0 off)"},
          {from: "手机 App", to: "用户", text: "显示录音已暂停", dashed: true},
          {from: "GlassCaptureAgent", to: "AudioSessionManager", text: "不发送原始音频", dashed: true},
          {from: "AudioSessionManager", to: "PreRollAudioBuffer", text: "不写入预录环", dashed: true},
          {from: "用户", to: "手机 App", text: "恢复记录"},
          {from: "手机 App", to: "PrivacyPolicyGate", text: "evaluatePrivacyContext()"},
          {from: "PrivacyPolicyGate", to: "手机 App", text: "recording_allowed = true", dashed: true},
          {from: "手机 App", to: "AudioSessionManager", text: "RESUME_FROM_PRIVATE(privacy_lock_id, user_action_id)"},
          {from: "AudioSessionManager", to: "GlassCaptureAgent", text: "startLowPowerAudio()"},
          {from: "AudioSessionManager", to: "PreRollAudioBuffer", text: "startEncryptedRingBuffer(60-120s)"},
          {from: "AudioSessionManager", to: "AudioSessionManager", text: "next A2 must create new conversation_id"}
        ]
      },
      {
        id: "a1-listening",
        title: "A1 Listening 低功耗监听",

    function inferFlowImpact(step, diagram) {
      const text = step.text;
      if (/A0|recording_allowed = false|clearAndStop|stopAudioCapture|forceLevel|end_reason=privacy/.test(text)) {
        return "影响：进入或维持隐私暂停链路，停止保存原始音频，并约束视觉层关闭。";
      }
      if (/A1|startLowPowerAudio|RingBuffer|low_power_audio_frame|detectVoice|appendEncrypted/.test(text)) {
        return "影响：维持低功耗监听和短预录，不生成正式会话证据。";
      }
      if (/A2|Conversation|Preroll|preroll|sequence_no=0|notifyA2Started|startConversation|EndPending|Finalize/.test(text)) {
        return "影响：建立正式会话时间线，预录、音频分片和视觉 L1 开始共享同一 conversation_id。";
      }
      if (/Chunk|chunk|Manifest|manifest|sha256|sequence|Continuity|gap|missing/.test(text)) {
        return "影响：保证音频分片可校验、可重试、可发现缺失，避免后续模型伪造缺口内容。";
      }
      if (/Semantic|semantic|Transcript|transcript|decision_id|allowL3|keepL1|L1 -> L3|LLM/.test(text)) {
        return "影响：基于手机端滚动音频语义生成视觉升级候选；失败或拒绝时保持 L1，不影响正式录音。";
      }
      if (/Spool|spool|source_seq|RealTimeAudio|Recovered|recovered/.test(text)) {
        return "影响：维持实时音频低延迟，并在断链后从眼镜 spool 去重补齐证据。";
      }
      if (/expected_stream_ranges|Completeness|complete|deadline|version|supersedes|LateChunks/.test(text)) {
        return "影响：等待云端收齐或显式以缺片状态定稿；迟到分片通过新版本修正结果。";
      }
      if (/upload|ack|Uploaded|Ingestion|ASR|Diarization|indexed|transcript_status|retry/.test(text)) {
        return "影响：把本地证据推进到云端处理和索引阶段，但不影响端侧继续录音。";
      }
      if (/source|Fallback|Overlap|align|SourceHistory|resumeAudio/.test(text)) {
        return "影响：在音频源切换时保留连续性，并在时间线上标明来源变化。";
      }
      if (step.dashed) {
        return "影响：这是状态返回或确认流，不携带新的原始音频。";
      }
      return "影响：推进当前音频状态机，不直接改变视觉策略，除非目标模块是 VisualLevelScheduler。";
    }

    function buildFlowDetail(diagram, step, index) {
      const from = getModule(step.from);
      const to = getModule(step.to);
      return {
        title: `步骤 ${index + 1}: ${step.text}`,
        purpose: explainFlow(step, diagram),
        route: `${step.from}（${from.device}） -> ${step.to}（${to.device}）`,
        impact: inferFlowImpact(step, diagram),
        signal: step.dashed ? "线型：虚线，表示返回值、状态确认或非主数据流。" : "线型：实线，表示命令、数据帧或主流程推进。"
      };
    }

    function serializeFlowDetail(detail) {
      return [
        detail.title,
        `含义：${detail.purpose}`,
        `部署：${detail.route}`,
        detail.impact,
        detail.signal
      ].join("\n");
    }

    function renderFlowTooltip(detail, event) {
      flowTooltip.innerHTML = `
        <h3>${escapeXml(detail.title)}</h3>
        <p><strong>含义：</strong>${escapeXml(detail.purpose)}</p>
        <p><strong>部署：</strong>${escapeXml(detail.route)}</p>
        <p><strong>状态/数据：</strong>${escapeXml(detail.impact.replace(/^影响：/, ""))}</p>
        <p><strong>${escapeXml(detail.signal)}</strong></p>
      `;
      flowTooltip.classList.add("visible");
      flowTooltip.setAttribute("aria-hidden", "false");
      moveFlowTooltip(event);
    }

    function renderModuleTooltip(name, event) {
      const mod = getModule(name);
      flowTooltip.innerHTML = `
        <span class="device-tag ${mod.tagClass || ""}">${escapeXml(mod.device)}</span>
        <h3>${escapeXml(name)}</h3>
        <p>${escapeXml(mod.desc)}</p>
      `;
      flowTooltip.classList.add("visible");
      flowTooltip.setAttribute("aria-hidden", "false");
      moveFlowTooltip(event);
    }

    function moveFlowTooltip(event) {
      if (!flowTooltip.classList.contains("visible")) return;
      const offset = 16;
      const rect = flowTooltip.getBoundingClientRect();
      let left = event.clientX + offset;
      let top = event.clientY + offset;
      if (left + rect.width > window.innerWidth - 10) left = event.clientX - rect.width - offset;
      if (top + rect.height > window.innerHeight - 10) top = event.clientY - rect.height - offset;
      flowTooltip.style.left = `${Math.max(10, left)}px`;
      flowTooltip.style.top = `${Math.max(10, top)}px`;
    }

    function hideFlowTooltip() {
      flowTooltip.classList.remove("visible");
      flowTooltip.setAttribute("aria-hidden", "true");
    }

    function participantX(index, count, width) {
      const margin = 112;
      if (count === 1) return width / 2;
      return margin + index * ((width - margin * 2) / (count - 1));
    }

    function wrapText(text, maxChars) {
      const chunks = [];
      let line = "";
      for (const char of String(text)) {
        const next = line + char;
        const weight = /[A-Za-z0-9_()/.=-]/.test(char) ? 0.62 : 1;
        const currentUnits = [...line].reduce((sum, c) => sum + (/[A-Za-z0-9_()/.=-]/.test(c) ? 0.62 : 1), 0);
        if (currentUnits + weight > maxChars && line) {
          chunks.push(line);
          line = char;
        } else {
          line = next;
        }
      }
      if (line) chunks.push(line);
      return chunks.slice(0, 3);
    }

    function blockBounds(block, rowYs, positions, width) {
      const startY = rowYs[block.from] - 22;
      const endY = rowYs[block.to] + 28;
      return {
        x: 42,
        y: startY,
        width: width - 84,
        height: Math.max(62, endY - startY)
      };
    }

    function renderDiagram() {
      const diagram = state.currentDiagram;
      const count = diagram.participants.length;
      const width = Math.max(1180, count * 168);
      const top = 94;
      const rowGap = 56;
      const height = top + diagram.steps.length * rowGap + 110;
      state.baseWidth = width;
      state.baseHeight = height;

      const positions = new Map();
      diagram.participants.forEach((name, index) => {
        positions.set(name, participantX(index, count, width));
      });

      const rowYs = diagram.steps.map((_, index) => top + index * rowGap);
      const blockParts = (diagram.blocks || []).map(block => {
        const b = blockBounds(block, rowYs, positions, width);
        const color = block.kind === "else" ? "#fbf2dc" : block.kind === "alt" ? "#edf3fb" : "#edf7f0";
        const stroke = block.kind === "else" ? "#d7bc73" : block.kind === "alt" ? "#b8cae6" : "#bdd9c7";
        return `
          <rect x="${b.x}" y="${b.y}" width="${b.width}" height="${b.height}" rx="8" fill="${color}" stroke="${stroke}" stroke-width="1.2" opacity="0.72"></rect>
          <rect x="${b.x}" y="${b.y}" width="168" height="28" rx="8" fill="${stroke}" opacity="0.42"></rect>
          <text x="${b.x + 12}" y="${b.y + 19}" font-size="13" font-weight="700" fill="#26362f">${escapeXml(block.kind.toUpperCase())}: ${escapeXml(block.label)}</text>
        `;
      }).join("");

      const participantParts = diagram.participants.map(name => {
        const x = positions.get(name);
        const mod = getModule(name);
        const color = deviceColors[mod.device] || (mod.tagClass === "cloud" ? "#946716" : mod.tagClass === "glasses" ? "#146b4c" : "#2e5f9f");
        const labelLines = wrapText(name, 16);
        const lineY = labelLines.length === 1 ? 50 : 41;
        const text = labelLines.map((line, idx) => `<text x="${x}" y="${lineY + idx * 16}" text-anchor="middle" font-size="13" font-weight="700" fill="#17211d">${escapeXml(line)}</text>`).join("");
        return `
          <g class="participant" data-module="${escapeXml(name)}" role="button" aria-label="${escapeXml(name)}">
            <rect x="${x - 74}" y="20" width="148" height="50" rx="8" fill="#ffffff" stroke="${color}" stroke-width="1.6"></rect>
            <circle cx="${x - 60}" cy="36" r="5" fill="${color}"></circle>
            ${text}
            <line x1="${x}" y1="70" x2="${x}" y2="${height - 46}" stroke="#cad5d0" stroke-width="1.3" stroke-dasharray="6 7"></line>
          </g>
        `;
      }).join("");

      const stepParts = diagram.steps.map((step, index) => {
        const y = rowYs[index];
        const fromX = positions.get(step.from);
        const toX = positions.get(step.to);
        const stepNo = index + 1;
        const detail = buildFlowDetail(diagram, step, index);
        const detailText = serializeFlowDetail(detail);
        if (fromX === toX) {
          const boxW = 120;
          const path = `
            M ${fromX} ${y}
            C ${fromX + 62} ${y}, ${fromX + 62} ${y + 34}, ${fromX} ${y + 34}
          `;
          const lines = wrapText(step.text, 24);
          return `
            <g class="message" data-module="${escapeXml(step.from)}" data-step-index="${index}">
              <title>${escapeXml(detailText)}</title>
              <rect x="${fromX - 10}" y="${y - 28}" width="248" height="82" fill="transparent" stroke="none"></rect>
              <text x="54" y="${y + 5}" font-size="12" fill="#62716a">${stepNo}</text>
              <path d="${path}" fill="none" stroke="#36463f" stroke-width="1.7" marker-end="url(#arrow)"></path>
              ${lines.map((line, idx) => `<text x="${fromX + boxW / 2 + 8}" y="${y + 7 + idx * 15}" font-size="12" fill="#17211d">${escapeXml(line)}</text>`).join("")}
            </g>
          `;
        }
        const minX = Math.min(fromX, toX);
        const maxX = Math.max(fromX, toX);
        const direction = toX > fromX ? 1 : -1;
        const labelX = (fromX + toX) / 2;
        const labelLines = wrapText(step.text, Math.max(16, Math.floor((maxX - minX) / 9)));
        const dash = step.dashed ? 'stroke-dasharray="7 6"' : "";
        const arrow = direction > 0 ? "url(#arrow)" : "url(#arrowLeft)";
        const hitY = y - 44 - Math.max(0, labelLines.length - 1) * 14;
        const hitHeight = 62 + Math.max(0, labelLines.length - 1) * 14;
        return `
          <g class="message" data-module="${escapeXml(step.from)}" data-step-index="${index}">
            <title>${escapeXml(detailText)}</title>
            <rect x="${minX - 12}" y="${hitY}" width="${maxX - minX + 24}" height="${hitHeight}" fill="transparent" stroke="none"></rect>
            <text x="54" y="${y + 5}" font-size="12" fill="#62716a">${stepNo}</text>
            <line x1="${fromX}" y1="${y}" x2="${toX}" y2="${y}" stroke="#36463f" stroke-width="1.7" ${dash} marker-end="${arrow}"></line>
            ${labelLines.map((line, idx) => `<text x="${labelX}" y="${y - 9 - (labelLines.length - 1 - idx) * 14}" text-anchor="middle" font-size="12" fill="#17211d">${escapeXml(line)}</text>`).join("")}
          </g>
        `;
      }).join("");

      svgWrap.innerHTML = `
        <svg id="sequenceSvg" xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="svgTitle svgDesc">
          <title id="svgTitle">${escapeXml(diagram.title)}</title>
          <desc id="svgDesc">${escapeXml(diagram.subtitle)}</desc>
          <defs>
            <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L9,3 L0,6 Z" fill="#36463f"></path>
            </marker>
            <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
              <path d="M9,0 L0,3 L9,6 Z" fill="#36463f"></path>
            </marker>
          </defs>
          <rect x="0" y="0" width="${width}" height="${height}" fill="#ffffff"></rect>
          ${blockParts}
          ${participantParts}
          ${stepParts}
        </svg>
      `;

      svgWrap.querySelectorAll(".participant[data-module]").forEach(node => {
        node.style.cursor = "help";
        node.addEventListener("pointerdown", event => {
          event.stopPropagation();
        });
        node.addEventListener("mouseenter", event => {
          const name = node.getAttribute("data-module");
          renderModuleTooltip(name, event);
        });
        node.addEventListener("mousemove", moveFlowTooltip);
        node.addEventListener("mouseleave", hideFlowTooltip);
      });

      svgWrap.querySelectorAll(".message[data-step-index]").forEach(node => {
        node.style.cursor = "help";
        node.addEventListener("mouseenter", event => {
          const stepIndex = Number(node.getAttribute("data-step-index"));
          const step = state.currentDiagram.steps[stepIndex];
          renderFlowTooltip(buildFlowDetail(state.currentDiagram, step, stepIndex), event);
        });
        node.addEventListener("mousemove", moveFlowTooltip);
        node.addEventListener("mouseleave", hideFlowTooltip);
      });

      updateZoom();
    }

    function renderSelectors() {
      diagramList.innerHTML = "";
      diagrams.forEach(diagram => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "diagram-tab";
        button.setAttribute("aria-pressed", diagram.id === state.currentDiagram.id ? "true" : "false");
        button.innerHTML = `${diagram.title}<span>${diagram.subtitle}</span>`;
        button.addEventListener("click", () => {
          hideFlowTooltip();
          state.currentDiagram = diagram;
          diagramTitle.textContent = diagram.title;
          diagramSubtitle.textContent = diagram.subtitle;
          renderSelectors();
          renderNotes();
          renderDiagram();
          fitToWidth();
        });
        diagramList.appendChild(button);
      });
    }

    function renderNotes() {
      reviewNotes.innerHTML = "";
      state.currentDiagram.notes.forEach(note => {
        const li = document.createElement("li");
        li.textContent = note;
        reviewNotes.appendChild(li);
      });
    }

    function updateZoom() {
      const zoom = state.zoom;
      svgWrap.style.transform = `scale(${zoom})`;
      svgWrap.style.width = `${state.baseWidth * zoom + 56}px`;
      svgWrap.style.height = `${state.baseHeight * zoom + 56}px`;
      zoomRange.value = Math.round(zoom * 100);
      zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
    }

    function setZoom(percent) {
      const oldZoom = state.zoom;
      const next = Math.max(0.55, Math.min(1.8, percent / 100));
      const centerX = viewport.scrollLeft + viewport.clientWidth / 2;
      const centerY = viewport.scrollTop + viewport.clientHeight / 2;
      const ratio = next / oldZoom;
      state.zoom = next;
      updateZoom();
      viewport.scrollLeft = centerX * ratio - viewport.clientWidth / 2;
      viewport.scrollTop = centerY * ratio - viewport.clientHeight / 2;
    }

    function fitToWidth() {
      const available = viewport.clientWidth - 42;
      const fit = Math.max(0.55, Math.min(1.25, available / state.baseWidth));
      state.zoom = fit;
      updateZoom();
      viewport.scrollLeft = 0;
      viewport.scrollTop = 0;
    }

    document.getElementById("zoomOut").addEventListener("click", () => setZoom(Math.round(state.zoom * 100) - 10));
    document.getElementById("zoomIn").addEventListener("click", () => setZoom(Math.round(state.zoom * 100) + 10));
    document.getElementById("fitBtn").addEventListener("click", fitToWidth);
    zoomRange.addEventListener("input", event => setZoom(Number(event.target.value)));

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let startLeft = 0;
    let startTop = 0;

    viewport.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      if (event.target.closest("[data-module]")) return;
      isDragging = true;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      startLeft = viewport.scrollLeft;
      startTop = viewport.scrollTop;
      viewport.classList.add("dragging");
      viewport.setPointerCapture(event.pointerId);
    });

    viewport.addEventListener("pointermove", event => {
      if (!isDragging) return;
      viewport.scrollLeft = startLeft - (event.clientX - dragStartX);
      viewport.scrollTop = startTop - (event.clientY - dragStartY);
    });

    viewport.addEventListener("pointerup", event => {
      if (!isDragging) return;
      isDragging = false;
      viewport.classList.remove("dragging");
      viewport.releasePointerCapture(event.pointerId);
    });

    viewport.addEventListener("wheel", event => {
      if (!event.ctrlKey) return;
      event.preventDefault();
      const delta = event.deltaY > 0 ? -8 : 8;
      setZoom(Math.round(state.zoom * 100) + delta);
    }, {passive: false});

    viewport.addEventListener("scroll", hideFlowTooltip);

    window.addEventListener("resize", () => {
      hideFlowTooltip();
      updateZoom();
    });

    renderSelectors();
    renderNotes();
    renderDiagram();
    requestAnimationFrame(fitToWidth);
  </script>
</body>
</html>
